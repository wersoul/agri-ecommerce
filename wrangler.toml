name = "knkpart"
compatibility_date = "2024-07-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "knkpart-db"
# NOTE: database_id ต้องสร้าง D1 database ใหม่บน Cloudflare และใส่ ID ที่ได้ที่นี่
# รันคำสั่ง: wrangler d1 create knkpart-db
database_id = "REPLACE_WITH_NEW_DATABASE_ID"